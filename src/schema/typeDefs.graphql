type Query {
  userTopAlbums(
    user: String!
    period: Period
    limit: Int
    page: Int
  ): TopAlbumsResponse!
  userTopArtists(
    user: String!
    period: Period
    limit: Int
    page: Int
  ): TopArtistsResponse!
}

type TopAlbumsResponse {
  albums: [Album!]!
  meta: PaginationMeta!
}

type TopArtistsResponse {
  artists: [TopArtist!]!
  meta: PaginationMeta!
}

type Album {
  name: String!
  playcount: String!
  mbid: String
  url: String!
  artist: Artist!
  images: [MediaImage!]!
  rank: Int!
}

type TopArtist {
  name: String!
  playcount: String!
  mbid: String
  url: String!
  images: [MediaImage!]!
  rank: Int!
}

type Artist {
  name: String!
  mbid: String
  url: String!
}

type MediaImage {
  url: String!
  size: String!
}

type PaginationMeta {
  user: String!
  totalPages: String!
  page: String!
  perPage: String!
  total: String!
}

enum Period {
  OVERALL
  SEVEN_DAY
  ONE_MONTH
  THREE_MONTH
  SIX_MONTH
  TWELVE_MONTH
}